<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanka Games</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10111b;color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#191a2b;padding:22px 7%;
 display:flex;justify-content:space-between;
 align-items:center;flex-wrap:wrap;gap:15px;
 border-bottom:1px solid #39334f;
}
.logo{font-size:27px;font-weight:bold;color:#a78bfa}
input{
 padding:13px;border:1px solid #444;
 border-radius:10px;background:#25263a;
 color:white;width:230px;
}
.hero{
 margin:30px auto;padding:45px 25px;
 max-width:1100px;border-radius:20px;
 background:linear-gradient(120deg,#33245e,#171a32);
}
.hero h1{font-size:38px}
.hero p{color:#ccc}
main{max-width:1100px;margin:auto;padding:20px}
.games{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
 gap:22px;
}
.game{
 background:#202337;border-radius:16px;
 overflow:hidden;border:1px solid #34364c;
 transition:.2s;
}
.game:hover{transform:translateY(-5px)}
.cover{
 height:170px;display:flex;
 justify-content:center;align-items:center;
 font-size:65px;
 background:linear-gradient(135deg,#493276,#171d39);
}
.info{padding:18px}
button{
 width:100%;padding:13px;
 border:0;border-radius:9px;
 background:#8065ff;color:white;
 font-weight:bold;font-size:16px;
 cursor:pointer;
}
button:hover{background:#684be8}
footer{
 text-align:center;padding:35px;color:#777;
}
@media(max-width:600px){
 header{justify-content:center}
 .hero h1{font-size:29px}
 input{width:100%}
}
</style>
</head>
<body>

<header>
 <div class="logo">🎮 KANKA GAMES</div>
 <input id="search" placeholder="Oyun ara...">
</header>

<section class="hero">
 <h1>OYUN DÜNYASINA HOŞ GELDİN!</h1>
 <p>En sevdiğin oyunları keşfet ve ücretsiz oyna.</p>
</section>

<main>
 <h2>🔥 Popüler Oyunlar</h2>

 <div class="games" id="games">

  <div class="game" data-name="ilk çağ kabileler savaşı">
   <div class="cover">⚔️</div>
   <div class="info">
    <h3>İlk Çağ Kabileler Savaşı</h3>
    <p>Kabilelerin savaşına katıl!</p>
    <button onclick="location.href='oyun.html'">
     OYNA
    </button>
   </div>
  </div>

 </div>
</main>

<footer>
 © 2026 Kanka Games | Ücretsiz Oyun Platformu
</footer>

<script>
document.getElementById("search").addEventListener("input",function(){
 let q=this.value.toLowerCase();
 document.querySelectorAll(".game").forEach(game=>{
  game.style.display=game.dataset.name.includes(q)?"block":"none";
 });
});
</script>

</body>
