<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanka Games</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: #10121c;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
header {
  padding: 35px 15px;
  background: #191d30;
  border-bottom: 2px solid #7865ff;
}
h1 {
  color: #8b7cff;
  font-size: 42px;
}
main {
  padding: 35px 15px;
}
.game {
  background: #20263b;
  padding: 25px;
  border-radius: 18px;
  max-width: 400px;
  margin: auto;
  box-shadow: 0 0 20px #7865ff33;
}
button {
  background: #7865ff;
  color: white;
  border: 0;
  padding: 14px 30px;
  border-radius: 10px;
  font-size: 17px;
  cursor: pointer;
}
footer {
  margin-top: 60px;
  padding: 20px;
  color: #888;
}
</style>
</head>
<body>

<header>
  <h1>KANKA GAMES</h1>
  <p>Ücretsiz oyun platformu</p>
</header>

<main>
  <div class="game">
    <h2>🎮 Oyunlarımız</h2>
    <p>Yeni oyunlarımız çok yakında burada!</p>
  </div>
</main>

<footer>
  © 2026 Kanka Games
</footer>

</body>
</html>
